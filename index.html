<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HelloCal - Intelligent Voice Calorie Tracker</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HelloCal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; background: #0a0b10; color: #f8fafc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration & Live Auto-Update System -->
    <script>
      // Skip the service worker inside the Capacitor native webview (native handles caching/offline).
      var __isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      if (!__isNativeApp && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service Worker active. Scope:', reg.scope);
              // Force browser to check if there is an update to sw.js immediately on page load
              reg.update();
            })
            .catch((err) => console.error('Service Worker registration failed:', err));
        });

        // Apply service worker updates when the tab is idle — not mid-form (e.g. account reset).
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          sessionStorage.setItem('hellocal_sw_reload_pending', '1');
          if (document.visibilityState === 'hidden') {
            refreshing = true;
            window.location.reload();
          }
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          if (!sessionStorage.getItem('hellocal_sw_reload_pending') || refreshing) return;
          refreshing = true;
          sessionStorage.removeItem('hellocal_sw_reload_pending');
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
