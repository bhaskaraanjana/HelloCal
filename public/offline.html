<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HelloCal — Offline</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@600;800&display=swap');

      :root {
        color-scheme: dark;
        --bg-primary: #0a0b10;
        --text-primary: #f8fafc;
        --text-secondary: #aab6c7;
        --text-muted: #7e8ca1;
        --accent-purple: #8b5cf6;
        --accent-purple-hover: #7c3aed;
        --accent-purple-glow: rgba(139, 92, 246, 0.4);
        --accent-purple-glow-hover: rgba(139, 92, 246, 0.6);
        --border-glass: rgba(255, 255, 255, 0.06);
        --shadow-color-light: rgba(0, 0, 0, 0.3);
        --font-display: 'Outfit', sans-serif;
        --font-body: 'DM Sans', sans-serif;
        --radius-md: 12px;
        --radius-lg: 20px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        text-align: center;
        padding: 2rem;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        background-image:
          radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
        -webkit-font-smoothing: antialiased;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-glass);
        box-shadow: 0 8px 32px var(--shadow-color-light);
      }
      h1 {
        font-family: var(--font-display);
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-top: 0.5rem;
        color: var(--text-primary);
        text-wrap: balance;
      }
      h1 span {
        color: var(--accent-purple);
      }
      p {
        color: var(--text-secondary);
        max-width: 380px;
        line-height: 1.6;
        font-size: 1rem;
      }
      button {
        margin-top: 1rem;
        background: var(--accent-purple);
        color: var(--text-primary);
        border: none;
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 600;
        padding: 0.8rem 2rem;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        box-shadow: 0 4px 15px var(--accent-purple-glow);
      }
      button:hover {
        background: var(--accent-purple-hover);
        box-shadow: 0 6px 20px var(--accent-purple-glow-hover);
        transform: translateY(-1px);
      }
      button:active {
        transform: scale(0.97);
      }
      .note {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 1rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/favicon.png" alt="HelloCal" onerror="this.style.display='none'" />
    <h1>You're <span>offline</span></h1>
    <p>HelloCal needs an internet connection to load for the first time. Once loaded, your logged data is stored privately on this device and can be accessed offline.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="note">HelloCal • Serverless &amp; Private</p>
  </body>
</html>
