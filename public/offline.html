<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HaloCal — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        text-align: center;
        padding: 2rem;
        background: #0a0b10;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background-image:
          radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
      }
      .logo {
        width: 84px; height: 84px; border-radius: 20px;
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
      }
      h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
      p { color: #aab6c7; max-width: 360px; line-height: 1.5; }
      button {
        margin-top: 0.5rem;
        background: #8b5cf6; color: #fff; border: none;
        font-size: 1rem; font-weight: 600;
        padding: 0.8rem 1.75rem; border-radius: 12px; cursor: pointer;
        box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      }
      button:active { transform: scale(0.97); }
      .note { font-size: 0.8rem; color: #7e8ca1; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <img class="logo" src="/favicon.png" alt="HaloCal" onerror="this.style.display='none'" />
    <h1>You're offline</h1>
    <p>HaloCal needs a connection to load for the first time. Your logged data is stored privately on this device and will be here when you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="note">HaloCal 🟡 Serverless &amp; Private</p>
  </body>
</html>
