<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HelloCal logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ring" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#ffffff" opacity="0.06"/>

  <!-- Calorie "halo" ring (open arc, rounded caps) -->
  <g filter="url(#soft)">
    <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="44"/>
    <circle cx="256" cy="256" r="132" fill="none" stroke="url(#ring)" stroke-width="44"
      stroke-linecap="round" stroke-dasharray="650 829" transform="rotate(-90 256 256)"/>
  </g>

  <!-- Leading "spark" dot at the open end of the halo -->
  <circle cx="256" cy="124" r="26" fill="#ffffff"/>

  <!-- Center mark: upward check/spark = progress & positivity -->
  <path d="M214 262 l30 30 l54 -64" fill="none" stroke="#ffffff" stroke-width="26"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
