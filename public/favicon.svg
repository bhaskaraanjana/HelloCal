<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HelloCal logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="apple" x1="150" y1="180" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a0b10" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="#ffffff" opacity="0.05"/>

  <!-- Apple body: two overlapping lobes -> classic silhouette -->
  <g filter="url(#soft)">
    <circle cx="214" cy="306" r="112" fill="url(#apple)"/>
    <circle cx="298" cy="306" r="112" fill="url(#apple)"/>
  </g>
  <!-- Top cleft between the lobes (carved with the tile gradient so it blends) -->
  <circle cx="256" cy="212" r="30" fill="url(#bg)"/>

  <!-- Stem -->
  <path d="M256 206 C 258 176, 268 162, 286 156" fill="none" stroke="#6b4226" stroke-width="13" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M286 156 C 320 150, 352 162, 360 196 C 326 202, 296 192, 286 156 Z" fill="#10b981"/>
  <path d="M298 168 C 318 174, 336 182, 350 192" fill="none" stroke="#0b7a5b" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Soft shine on the apple -->
  <ellipse cx="196" cy="262" rx="34" ry="46" fill="#ffffff" opacity="0.55" transform="rotate(-22 196 262)"/>
</svg>
